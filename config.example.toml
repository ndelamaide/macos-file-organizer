# Copy this file to config.toml and edit it.
# config.toml is gitignored, so your categories and paths stay private.

# Local Ollama model. Cloud models are refused: your files would leave the machine.
model = "qwen3.5:9b"

# Characters of each file's text sent to the model.
max_chars = 3000

# OCR languages for images and scanned PDFs, in order of preference.
ocr_languages = ["fr-FR", "en-US"]

# Root folder for sorted files: each category becomes a subfolder here.
# Point it at your mirrored Google Drive folder (check the exact path in Finder).
destination = "~/My Drive"

# Below this confidence, a file goes to the inbox category for you to decide.
min_confidence = 0.6
inbox = "Inbox"

# Folders never scanned. Two kinds of entries:
#   - a bare name ("node_modules") skips every folder with that name, anywhere
#   - a path starting with / or ~ ("~/Documents/Archive") skips that exact folder
# Folders containing a .git repo, hidden folders and app bundles are always skipped,
# so code is never touched.
exclude = ["node_modules", ".venv", "venv", "__pycache__", "Library", "Applications"]

# ---- File names ----
# Files are renamed from a template. Placeholders: {date}, {title}, {group}, {subfolder}.
#   {date}  = the date that matters for that kind of document, read from its content
#             (never the file's creation date). Left out if the document doesn't show it.
#   {title} = a few words saying what the document is, written by the model.
# Categories and subfolders can override all three settings below.
filename = "{date}-{title}"
# Language for {title}. Empty = the document's own language.
title_language = ""
# Default date rule and precision ("year", "month" or "day"), used when a category doesn't set its own.
date = "the date the document is about or was issued (e.g. invoice date, letter date)"
date_precision = "day"

# ---- Categories ----
# "Folder/Subfolder" = "when to use it".
# The model can only pick from these, and the descriptions are what it goes by:
# make them specific, and say which folder wins in borderline cases.
# Categories with more settings (date rules, grouping…) use the [categories."…"] form further down.
[categories]
"Admin/Government-FR" = "Other French administration: préfecture, mairie, CAF, URSSAF, France Travail, official letters"
"Admin/Government-CH" = "Other Swiss administration: commune, cantonal offices, AVS, unemployment fund (caisse de chômage), official letters"
"Admin/Housing"       = "Leases, rent, utilities, internet and phone contracts"
"Admin/Vehicle"       = "Car registration (carte grise), purchase, maintenance, fines"
"Finance/Investing"   = "Brokerage statements, pension (3e pilier, PER), investment documents"
"Work/Projects"       = "Business and side-project paperwork: company registration, client invoices, contracts"
"Learning"            = "Course material, papers, ebooks, study notes"
"Personal"            = "Photos, letters, personal projects and keepsakes"

# ---- Categories with their own settings ----
#   description    = when to use it (required)
#   destination    = keep this category somewhere other than the root, e.g. off Google Drive
#   date           = which date to use in the filename for this kind of document
#   date_precision = "year", "month" or "day"
#   filename       = filename template, e.g. "{date}-payslip"
#   group_by       = one folder per <thing> read from the document (employer, bank…).
#                    Existing folders are reused, so "Acme SA" and "ACME" end up in the same one.
#                    Rename a group folder by hand and future files follow the new name.
#   subfolders     = fixed document types inside each group: a list of names, or one
#                    [categories."…".subfolders.Name] table each, which can also set
#                    description, date, date_precision and filename.
# Resulting path: <category>/<group>/<subfolder>/<filename>

[categories."Identity"]
description = "Passport, ID card, driving licence, residence permit, birth certificate"
date = "the issue date (date de délivrance)"

[categories."Identity".subfolders.CH]
description = "Any identity documents related to Switzerland"

[categories."Identity".subfolders.FR]
description = "Any identity documents related to France"

[categories."Admin/Taxes-FR"]
description = "French taxes: déclaration de revenus, avis d'imposition, taxe foncière, taxe d'habitation"
date = "the tax year the document is about (e.g. 'revenus 2024' -> 2024), not the date it was sent"
date_precision = "year"

[categories."Admin/Taxes-CH"]
description = "Swiss taxes: déclaration d'impôt, impôt à la source, salary tax certificates"
date = "the tax year the document is about (période fiscale), not the date it was sent"
date_precision = "year"

[categories."Finance/Invoices"]
description = "Receipts and invoices for purchases, warranties, subscriptions"
date = "the invoice or purchase date"

[categories."Education"]
description = "Diplomas, transcripts, certificates of completion"
date = "the date the diploma or certificate was awarded"
date_precision = "year"

[categories."Health"]
description = "Medical reports, prescriptions, test results, doctor and pharmacy bills (insurance contracts go in Admin/Insurance)"
date = "the date of the consultation, test or treatment"

[categories."Health".subfolders.Prescriptions]
description = "Prescriptions for meds or treatments"
date = "the date when the prescription was written"

[categories."Health".subfolders.Results]
description = "Results of physical exams, scans, bloodwork"
date = "the date when the exam was taken or results given"

[categories."Travel"]
description = "Tickets, boarding passes, hotel bookings, itineraries, travel visas"
date = "the date of travel or check-in (not the booking date)"

[categories."Finance/Banking"]
description = "Bank and card statements, account opening or closing documents"
group_by = "bank"
date = "the end of the statement period, or the letter date for other documents"
date_precision = "month"

[categories."Admin/Insurance"]
description = "Insurance contracts and claims: health insurance (LAMal, mutuelle), home, car, liability"
group_by = "insurer"

[categories."Admin/Insurance".subfolders.Contracts]
description = "Policy, contract, yearly premium notice (avis de prime), termination"
date = "the start date of the policy or of the period the premium covers"

[categories."Admin/Insurance".subfolders.Claims]
description = "Claim, reimbursement statement (décompte de prestations)"
date = "the date of the event or treatment being reimbursed"

[categories."Admin/Insurance".subfolders.Invoices]
description = "Premium invoice or payment reminder"
date = "the invoice date"

[categories."Work/Employment"]
description = "Employment contracts and amendments, payslips, work certificates, job references from a specific employer"
group_by = "employer"

[categories."Work/Employment".subfolders.Contracts]
description = "Employment contract, amendment (avenant), resignation or termination letter"
date = "the start date for a contract, otherwise the date the letter was signed"

[categories."Work/Employment".subfolders.Payslips]
description = "Monthly payslip (fiche de paie, bulletin de salaire, décompte de salaire)"
date = "the pay period: the month the salary is for, NOT the payment or print date"
date_precision = "month"
filename = "{date}-payslip"

[categories."Work/Employment".subfolders.Certificates]
description = "Work certificate, reference letter, attestation employeur, certificat de travail"
date = "the issue date"

[categories."Work/Employment".subfolders.Other]
description = "Anything else from this employer"
